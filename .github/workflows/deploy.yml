name: CI/CD — Curify AI Advisor

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly retraining: every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deployment target"
        required: false
        default: "render"
        type: choice
        options: [render, railway, gcp]
      reset_chroma:
        description: "Reset ChromaDB before retraining"
        required: false
        default: "false"
        type: boolean

# Cancel in-progress runs on the same branch (saves CI minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: curify-ai-advisor

jobs:

  # ─── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.4.7

      - name: Run ruff lint
        run: ruff check app/ scripts/ models/ tests/ --select E,F,W,I --ignore E501

  # ─── Job 2: Test ────────────────────────────────────────────────────────────
  test:
    name: "🧪 Pytest"
    runs-on: ubuntu-latest
    needs: lint

    env:
      # Minimal env vars for tests — never use real secrets in CI test jobs
      GEMINI_API_KEY: ""
      TRAIN_API_KEY: test_ci_key_12345
      DATABASE_URL: "sqlite+aiosqlite:///./test_curify.db"
      CHROMA_PERSIST_DIR: "./test_chroma_db"
      ENVIRONMENT: "testing"
      DEBUG: "true"
      MODEL_DIR: "./models/saved"
      TRAINING_DATA_PATH: "./data/raw/sample_training_data.csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          cp .env.example .env
          echo "GEMINI_API_KEY=" >> .env
          echo "TRAIN_API_KEY=test_ci_key_12345" >> .env

      - name: Run classifier tests
        run: |
          python -m pytest tests/test_classifier.py -v --tb=short --timeout=120

      - name: Run chatbot tests
        run: |
          python -m pytest tests/test_chatbot.py -v --tb=short --timeout=120

      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v --tb=short --timeout=120

      - name: Run full test suite with coverage
        run: |
          pip install pytest-cov
          python -m pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            -v --tb=short --timeout=120

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Cleanup test artifacts
        if: always()
        run: |
          rm -rf test_chroma_db test_curify.db .env

  # ─── Job 3: Build Docker Image ──────────────────────────────────────────────
  build:
    name: "🐳 Docker Build"
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: runtime

  # ─── Job 4: Deploy to Render ────────────────────────────────────────────────
  deploy-render:
    name: "🚀 Deploy to Render"
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.deploy_target == 'render' || github.event.inputs.deploy_target == '')
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deploy-url }}

    steps:
      - name: Deploy to Render via webhook
        id: deploy
        run: |
          echo "Triggering Render deploy hook..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $RESPONSE"
          if [ "$RESPONSE" != "200" ] && [ "$RESPONSE" != "201" ]; then
            echo "::error::Render deploy hook failed with status $RESPONSE"
            exit 1
          fi
          echo "deploy-url=${{ secrets.RENDER_APP_URL }}" >> $GITHUB_OUTPUT

      - name: Wait for Render deploy to complete
        run: |
          echo "Waiting 60s for Render to deploy..."
          sleep 60

      - name: Health check post-deploy
        run: |
          curl -f "${{ secrets.RENDER_APP_URL }}/health" || \
            (echo "::error::Health check failed after deploy" && exit 1)

  # ─── Job 5: Weekly Retraining (cron) ────────────────────────────────────────
  weekly-retrain:
    name: "🔄 Weekly Retrain"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TRAIN_API_KEY: ${{ secrets.TRAIN_API_KEY }}
      DATABASE_URL: "sqlite+aiosqlite:///./curify_chat.db"
      CHROMA_PERSIST_DIR: "./chroma_db"
      ENVIRONMENT: "production"
      DEBUG: "false"
      MODEL_DIR: "./models/saved"
      TRAINING_DATA_PATH: "./data/raw/sample_training_data.csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly retraining (dry-run in CI)
        run: |
          python scripts/retrain_weekly.py \
            --dry-run \
            --min-samples 5 \
            --since-hours 168

      - name: Trigger production retrain via API
        if: vars.TRIGGER_PRODUCTION_RETRAIN == 'true'
        run: |
          curl -X POST "${{ secrets.RENDER_APP_URL }}/train" \
            -H "X-API-Key: ${{ secrets.TRAIN_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"reset_chroma": false}'
